[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polars-sheets-query"
version = "0.1.0"
description = "MVP builder for Google Sheets QUERY formulas with config references"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["polars_sheets_query*"]
