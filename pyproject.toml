[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polars-gsquery"
version = "0.2.0"
description = "Build Google Sheets QUERY formulas from a Polars-friendly DSL"
requires-python = ">=3.10"


dependencies = []

[project.optional-dependencies]
colab = [
  "gspread>=6.0.0",
  "google-api-python-client>=2.0.0",
  "google-auth>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["polars_gsquery*"]
