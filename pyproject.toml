[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polars-gsquery"
version = "0.2.0"
description = "Build Google Sheets QUERY formulas from a Polars-friendly DSL"
requires-python = ">=3.10"


dependencies = []



[project.optional-dependencies]
colab = [
  "gspread>=6.0.0",
  "google-api-python-client>=2.0.0",
  "google-auth>=2.0.0",
]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
branch = true
source = ["polars_gsquery"]

[tool.coverage.report]
show_missing = true

[tool.setuptools.packages.find]
where = ["."]
include = ["polars_gsquery*"]
